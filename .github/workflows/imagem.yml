name: imagem
# Builda e publica a imagem no ghcr a cada tag v* (ex: v1.7.0 publica :1.7.0 e
# :estavel; v1.8.0-rc1 publica só :1.8.0-rc1). O GITHUB_TOKEN do Actions publica pacote do próprio dono sem PAT.
# :latest não é mais atualizado: o chão atualiza só por versão (canal estavel), e
# as instalações antigas com watchtower ficam na 1.6.9 até migrarem.
# Assinatura: cada imagem publicada é assinada com cosign keyless (OIDC do Actions,
# sem chave guardada). O agente do chão só aceita imagem por digest cuja assinatura
# tem a identidade .../imagem.yml@refs/tags/v<versao>. O job só roda a partir de
# tag v* (a execução manual também precisa ser disparada numa tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "tag da imagem (ex: 1.7.0)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless: o Actions emite o token OIDC que vira o certificado da assinatura

jobs:
  build:
    # só tag v*: execução manual de branch não pode sobrescrever :X.Y.Z nem :estavel (tags mutáveis que
    # instalações antigas sem digest ainda puxam). A manual continua existindo, mas só roda a partir de uma tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          VERSAO_MANUAL: ${{ inputs.versao }}
        run: |
          if [ -n "$VERSAO_MANUAL" ]; then v="$VERSAO_MANUAL"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "versao=$v" >> "$GITHUB_OUTPUT"
      # :estavel só anda com versão final. Pré-release (1.8.0-rc1) publica só a
      # própria tag, pra não empurrar teste pro canal que as instalações seguem.
      - id: tags
        env:
          VERSAO: ${{ steps.v.outputs.versao }}
          IMAGEM: ghcr.io/augustogobatto/comentaeuquero
        run: |
          {
            echo "tags<<FIM"
            echo "$IMAGEM:$VERSAO"
            case "$VERSAO" in
              *-*) ;;
              *) echo "$IMAGEM:estavel" ;;
            esac
            echo "FIM"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      # assina o DIGEST (nunca a tag: tag muda, digest não). Vai pro log público do Sigstore (Rekor).
      - id: assinar
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGEM: ghcr.io/augustogobatto/comentaeuquero
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "digest vazio ou inválido: '$DIGEST'"; exit 1;; esac
          cosign sign --yes "$IMAGEM@$DIGEST"
